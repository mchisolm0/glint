# The app's data: the DataSource that answers app.contract's sources (docs/reference.md, "Rust data sources").
# It is a member of the workspace exact2 generates from app.json, which also holds the host crates that link it.
[package]
name = "swift-data-data"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
workspace = "../.exact/shells"

[lib]
name = "swift_data_data"
crate-type = ["rlib"]

[dependencies]
exact-runner.workspace = true

# `build.rs` writes the view's shapes as Rust structs (`contract rust`).
[build-dependencies]
contract.workspace = true

# A Swift bridge, as Glint's capture crate links ScreenCaptureKit's; the web build has no Swift.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
bridge = { path = "../bridge" }
