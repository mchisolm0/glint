# The nested test session's Hyprland config: stock behavior, minus what would slow or clutter a test.
# Screen-sized, so GNOME auto-maximizes the nested window: it maps 1:1 below the top bar (y + 32).
monitor = , 1920x1080, 0x0, 1
animations {
  enabled = false
}
misc {
  disable_hyprland_logo = true
  disable_splash_rendering = true
}
ecosystem {
  no_update_news = true
  no_donation_nag = true
}
